<article class="card">
  {% if beat.cover_image %}<img class="cover" src="{{ beat.cover_image.url }}" alt="Cover art for {{ beat.title }}">{% else %}<div class="cover placeholder">♪</div>{% endif %}
  <div class="card-body">
    <h3><a href="{{ beat.get_absolute_url }}">{{ beat.title }}</a></h3>
    <p class="meta">{% if beat.bpm %}{{ beat.bpm }} BPM{% endif %}{% if beat.bpm and beat.musical_key %} · {% endif %}{{ beat.musical_key }}</p>
    <div class="card-foot">
      <span class="price">{{ beat.price|floatformat:2 }} {{ CURRENCY }}</span>
      <a class="btn btn-small" href="{{ beat.get_absolute_url }}">View</a>
    </div>
  </div>
</article>
