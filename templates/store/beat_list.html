{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="section-head">
    <h1>Beats</h1>
    <form method="get" class="search">
      <input type="search" name="q" value="{{ query }}" placeholder="Search title or key…" aria-label="Search beats">
      <button class="btn btn-small">Search</button>
    </form>
  </div>
  <div class="grid">
    {% for beat in beats %}{% include "store/_beat_card.html" %}{% empty %}<p class="muted">No beats match your search.</p>{% endfor %}
  </div>
</section>
{% endblock %}
