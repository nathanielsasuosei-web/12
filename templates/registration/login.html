{% extends "base.html" %}
{% block title %}Log in · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section narrow">
  <h1>Log in</h1>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-wide">Log in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Create one</a>.</p>
</section>
{% endblock %}
