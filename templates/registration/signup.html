{% extends "base.html" %}
{% block title %}Create account · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section narrow">
  <h1>Create your account</h1>
  <p class="muted">Buy beats, get receipts and files by email, and find every purchase in one place.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-wide">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
</section>
{% endblock %}
