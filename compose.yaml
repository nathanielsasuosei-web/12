# Production stack: Django app (gunicorn) behind Caddy, which handles HTTPS
# and serves public media files. Copy .env.example to .env and fill it in first.
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - app-data:/app/data            # SQLite database
      - media:/app/media              # covers, previews, videos (public)
      - private:/app/private_media    # full beat files (never served directly)

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro           # Caddy only sees the public media volume
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  media:
  private:
  caddy-data:
  caddy-config:
